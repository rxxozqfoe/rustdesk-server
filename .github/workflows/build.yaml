name: build

# Standalone custom-client image pipeline — intentionally NOT gated by
# the _validate.yml security pipeline (lint/clippy/Trivy/verify-base-
# images live on the separate CI hardening branch/PR). This branch
# exists so the image can be built and shipped first, independently.
#
# It still self-attests: multi-arch build + SBOM + SLSA provenance +
# keyless cosign signature + a signature self-verify smoke test.
#
# Triggered manually (workflow_dispatch) or by a custom-client tag
# (N.N.N-mycustom.N).

on:
  workflow_dispatch:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+-mycustom.[0-9]+'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build, push, sign and attest custom-client image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write  # keyless cosign signing via GitHub OIDC
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Custom-client tag strategy:
      #   - :latest             (rolling custom-client tag)
      #   - :<git ref name>     (the N.N.N-mycustom.N tag, or branch on
      #                          a manual workflow_dispatch run)
      - name: Build and push multi-arch image
        id: push
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Sign image (keyless)
        env:
          COSIGN_YES: "true"
          IMAGE_DIGEST_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          echo "Signing $IMAGE_DIGEST_REF"
          cosign sign "$IMAGE_DIGEST_REF"

  verify-published-image:
    name: Verify our own signature
    runs-on: ubuntu-24.04
    needs: build-and-push
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify signature
        env:
          IMAGE_DIGEST_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.digest }}
          # Custom builds run from a branch (workflow_dispatch) or a
          # *-mycustom.* tag, so accept both refs/heads and refs/tags.
          IDENTITY_REGEXP: ^https://github\.com/${{ github.repository }}/\.github/workflows/.+@refs/(heads|tags)/.+
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
            --certificate-identity-regexp="$IDENTITY_REGEXP" \
            "$IMAGE_DIGEST_REF"
